<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Crisp white with very soft mint tint -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>

    <!-- Main Sprout & Path Emerald Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Leaf Accent Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Golden Star / Goal Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Elements -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.18"/>
    </filter>
    
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#a7f3d0" stroke-width="6"/>

  <!-- Icon Artwork Group with Soft Glow -->
  <g filter="url(#softShadow)">
    
    <!-- Dynamic Rising Path (Curve of letter 'م' ascending towards goal) -->
    <path d="M 145 345 
             C 145 375, 180 395, 215 385 
             C 255 375, 275 330, 275 280 
             C 275 200, 310 160, 355 135" 
          fill="none" 
          stroke="url(#mintGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- The Base Loop of 'م' (Seed & Grounded Foundation) -->
    <circle cx="190" cy="340" r="42" fill="none" stroke="url(#mintGrad)" stroke-width="32"/>

    <!-- Left Organic Sprout Leaf (Representing Habits, Quran & Vitality) -->
    <path d="M 275 280 
             C 230 250, 190 265, 185 220 
             C 225 210, 265 240, 275 280 Z" 
          fill="url(#leafGrad)"/>

    <!-- Right Ascending Sprout Leaf (Representing Knowledge, Thanawya & Coding) -->
    <path d="M 305 215 
             C 335 175, 375 180, 395 140 
             C 385 185, 345 205, 305 215 Z" 
          fill="url(#leafGrad)"/>

    <!-- Arrow Peak / Tip Pointing towards Excellence -->
    <polyline points="330,135 365,130 360,165" 
              fill="none" 
              stroke="url(#mintGrad)" 
              stroke-width="34" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>

    <!-- Glowing Golden Goal Star (Faculty of Computers & AI Target) -->
    <circle cx="395" cy="105" r="22" fill="url(#goldGrad)" filter="url(#starGlow)"/>
    <polygon points="395,88 400,100 412,105 400,110 395,122 390,110 378,105 390,100" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
